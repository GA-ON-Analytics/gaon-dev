name: CD - Deploy to Oracle

on:
  push:
    branches: ['feat/#22-github-actions-deploy']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Node 준비
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 프론트 빌드
        run: npm run build

      - name: 빌드 결과 확인
        run: |
          ls -lh dist
          ls -lh dist/assets
          du -sh dist/dashboard

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "키 파일 권한:"
          ls -l ~/.ssh/deploy_key

      - name: 서버 접속 테스트
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'whoami; hostname; sudo -n systemctl is-active gaon-api; which rsync'

      - name: 서버로 전송
        run: |
          SSH="ssh -i ~/.ssh/deploy_key"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          echo "===== ① backend ====="
          rsync -az --delete --stats \
            --exclude='__pycache__' --exclude='*.pyc' \
            -e "$SSH" backend/ "$TARGET:/srv/gaon/backend/"

          echo ""
          echo "===== ② dist (geojson 제외) ====="
          rsync -az --delete --stats --exclude='dashboard' \
            -e "$SSH" dist/ "$TARGET:/srv/gaon/dist/"

          echo ""
          echo "===== ③ dashboard geojson ====="
          rsync -az --delete --stats --size-only \
            -e "$SSH" dist/dashboard/ "$TARGET:/srv/gaon/dist/dashboard/"